<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cosmo by arstro</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#07090d; color:#e6e9ef; font:14px system-ui, sans-serif; }
  header { display:flex; gap:14px; align-items:center; padding:8px 12px; height:36px; box-sizing:border-box; }
  #status { color:#8b94a7; }
  canvas { display:block; }
  label.open { background:#f2b24a; color:#0a0c11; padding:5px 12px; border-radius:7px; cursor:pointer; font-weight:600; }
  input[type=file] { display:none; }
</style>
</head>
<body>
  <header>
    <strong>Cosmo</strong><span style="color:#8b94a7">by arstro</span>
    <label class="open">Open images<input id="file" type="file" accept="image/*" multiple /></label>
    <span id="status">loading…</span>
  </header>
  <canvas id="c"></canvas>
  <script src="cosmo.js"></script>
  <script src="app.js"></script>
</body>
</html>
